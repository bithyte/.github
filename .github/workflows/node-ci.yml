name: node-ci

# Reusable CI for Node projects. Call it from a repo with:
#   uses: bithyte/.github/.github/workflows/node-ci.yml@main
on:
  workflow_call:
    inputs:
      node-version:
        description: Node version to install
        type: string
        default: '24'
      install-command:
        description: Installs dependencies
        type: string
        default: npm ci
      check-command:
        description: Typecheck and lint; skipped when empty
        type: string
        default: npm run check --if-present
      test-command:
        description: Runs the tests; skipped when empty
        type: string
        default: npm test

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - run: ${{ inputs.install-command }}

      - if: inputs.check-command != ''
        run: ${{ inputs.check-command }}

      - if: inputs.test-command != ''
        run: ${{ inputs.test-command }}
