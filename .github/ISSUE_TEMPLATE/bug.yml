name: Bug report
description: Something doesn't work the way the docs say it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or config that shows the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.7.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Node 24.2, Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove tokens and other secrets first.
      render: text
